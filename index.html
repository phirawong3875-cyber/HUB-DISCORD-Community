<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ศูนย์รวมดิสคนไทย (ดิสใหม่)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html">DISCORD HUB</a>
    <span class="top-label">THAI COMMUNITY</span>
  </header>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">WELCOME TO THE COMMUNITY</p>
      <h1>ศูนย์รวมดิสคนไทย <span>(ดิสใหม่)</span></h1>
      <p class="hero-desc">
        ค้นหา Discord Community ที่คุณสนใจ
        แล้วเข้ามาทำความรู้จักเพื่อนใหม่กัน!
      </p>
    </section>

    <section class="toolbar">
      <input
        type="search"
        id="searchInput"
        placeholder="ค้นหาชื่อดิส หรือคำอธิบาย..."
      >

      <select id="categoryFilter">
        <option value="">ทุกหมวดหมู่</option>
      </select>

      <select id="sortSelect">
        <option value="newest">เพิ่มล่าสุด</option>
        <option value="oldest">เพิ่มเก่าสุด</option>
        <option value="name">เรียงตามชื่อ</option>
      </select>
    </section>

    <section class="list-heading">
      <h2>เซิร์ฟเวอร์ทั้งหมด</h2>
      <span id="serverCount">กำลังโหลด...</span>
    </section>

    <section id="serverList" class="server-list">
      <p class="loading">กำลังโหลดข้อมูล...</p>
    </section>

    <nav id="pagination" class="pagination"></nav>
  </main>

  <footer class="footer">
    <p>© 2026 Thai Discord Community Directory</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
